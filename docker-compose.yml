services:
  postgres:
    image: postgres:17
    container_name: ai_agent_postgres
    environment:
      POSTGRES_DB: ai_agent_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: